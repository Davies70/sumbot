<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumBot AI | Intelligent Text Summarization</title>

    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body
    class="bg-slate-950 text-slate-200 min-h-screen bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.2),rgba(255,255,255,0))] selection:bg-blue-500/30 font-sans antialiased"
  >
    <div class="max-w-4xl mx-auto px-4 py-8 md:py-16 flex flex-col gap-6">
      <header class="text-center space-y-3 mb-4">
        <h1
          class="text-3xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400"
        >
          SumBot.AI
        </h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
          Paste your text below and let the machine distill the most important
          information for you.
        </p>
      </header>

      <div
        id="errorBanner"
        class="hidden bg-red-500/10 border border-red-500/50 text-red-400 rounded-xl p-4 text-sm text-center font-medium backdrop-blur-sm"
      ></div>

      <main
        class="bg-white/5 border border-white/10 backdrop-blur-xl rounded-3xl p-4 md:p-8 shadow-2xl flex flex-col gap-6"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label
              for="algorithm"
              class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
              >Engine</label
            >
            <div class="relative">
              <select
                id="algorithm"
                class="w-full appearance-none bg-slate-900/50 border border-slate-700 text-slate-200 text-sm md:text-base rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all cursor-pointer disabled:opacity-50"
              >
                <option value="neural">Neural Network (High Quality)</option>
                <option value="extractive">Extractive (Instant/Offline)</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
            <span
              id="neuralWarning"
              class="text-[10px] text-purple-400 italic transition-opacity"
              >* Neural engine downloads ~25MB AI model on first run</span
            >
          </div>

          <div id="lengthContainer" class="hidden flex-col gap-2">
            <label
              for="summaryLength"
              class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
              >Summary Length</label
            >
            <div class="relative">
              <select
                id="summaryLength"
                class="w-full appearance-none bg-slate-900/50 border border-slate-700 text-slate-200 text-sm md:text-base rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all cursor-pointer disabled:opacity-50"
              >
                <option value="short">Short (~20% of original text)</option>
                <option value="medium" selected>
                  Medium (~35% of original text)
                </option>
                <option value="long">Long (~50% of original text)</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <textarea
            id="inputText"
            rows="8"
            placeholder="Paste your article, document, or essay here (minimum 100 words)..."
            class="w-full bg-slate-900/40 border border-slate-700/50 text-slate-100 text-sm md:text-base rounded-xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all resize-y placeholder:text-slate-600 disabled:opacity-50"
          ></textarea>

          <div class="flex flex-wrap justify-between items-center mt-2 gap-4">
            <span
              id="wordCount"
              class="text-xs font-medium text-slate-400 bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700"
              >0 words</span
            >

            <div class="flex gap-2">
              <button
                id="clearBtn"
                class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl transition-all duration-200 active:scale-95 text-sm disabled:opacity-50 hidden"
              >
                Clear
              </button>
              <button
                id="summarizeBtn"
                disabled
                class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 shadow-[0_0_15px_rgba(59,130,246,0.2)] hover:shadow-[0_0_25px_rgba(59,130,246,0.4)] text-sm md:text-base flex items-center gap-2"
              >
                Generate Summary
              </button>
            </div>
          </div>
        </div>

        <hr class="border-slate-800/60 my-2" />

        <div class="min-h-[150px] relative">
          <div
            id="placeholder"
            class="absolute inset-0 flex items-center justify-center text-slate-500 text-sm italic text-center"
          >
            Your summary will appear here...
          </div>

          <div
            id="loadingIndicator"
            class="hidden absolute inset-0 flex flex-col items-center justify-center gap-4"
          >
            <span
              id="loaderText"
              class="text-sm md:text-base font-bold tracking-wide animate-pulse bg-gradient-to-r from-blue-400 via-purple-400 to-blue-400 bg-clip-text text-transparent"
            >
              Initializing Engine...
            </span>
            <div
              id="progressContainer"
              class="hidden w-full max-w-xs h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700"
            >
              <div
                id="progressBar"
                class="h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0 transition-all duration-300 ease-out"
              ></div>
            </div>
          </div>

          <div
            id="summaryResults"
            class="hidden w-full text-sm md:text-base text-slate-200 leading-relaxed bg-slate-900/30 rounded-xl p-4 md:p-6 border border-slate-800/50"
          ></div>
        </div>
      </main>

      <footer class="text-center text-xs text-slate-500 mt-8">
        Built with Transformers.js & Web Workers.
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
